<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пользователи</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="app-header">
      <h1>Пользователи</h1>
      <p class="app-lead">Добавляйте людей и управляйте списком</p>
    </header>

    <main class="layout">
      <section class="card card-form" aria-labelledby="add-heading">
        <h2 id="add-heading" class="card-title">Новый пользователь</h2>
        <form id="user-form" novalidate>
          <fieldset id="form-fields">
            <div class="field">
              <label for="name">Имя</label>
              <input id="name" name="name" type="text" autocomplete="name" aria-describedby="name-error" aria-required="true">
              <p id="name-error" class="field-error" aria-live="polite"></p>
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-error" aria-required="true">
              <p id="email-error" class="field-error" aria-live="polite"></p>
            </div>
            <p id="form-error" class="error" role="alert" hidden></p>
            <button id="add-button" class="btn btn-primary" type="submit">Добавить</button>
          </fieldset>
        </form>
      </section>

      <section class="card card-list" aria-labelledby="list-heading">
        <div class="card-head">
          <h2 id="list-heading" class="card-title">Список пользователей</h2>
          <span id="count" class="count" hidden>0</span>
        </div>

        <div class="search">
          <label for="search" class="visually-hidden">Поиск</label>
          <svg class="search-icon" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13.5 13.5 4 4"/></svg>
          <input id="search" type="search" placeholder="Поиск по имени" autocomplete="off">
          <button id="search-clear" class="search-clear" type="button" aria-label="Очистить поиск">
            <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
          </button>
        </div>

        <p id="list-error" class="error" role="alert" hidden></p>
        <div id="status" class="status" aria-live="polite" data-kind="loading" hidden>
          <svg class="status-icon" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5M17 5.5a3.5 3.5 0 0 1 0 5.5M18.5 14.8c1.8.7 3 2.3 3.3 4.7"/></svg>
          <p id="status-message"></p>
          <div class="skeleton" aria-hidden="true"><i></i><i></i><i></i></div>
          <button id="retry-button" class="btn btn-secondary" type="button" hidden>Повторить</button>
        </div>
        <ul id="users"></ul>
      </section>
    </main>

    <dialog id="confirm-dialog" class="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-text">
      <form method="dialog" class="dialog-body">
        <h2 id="dialog-title">Удалить пользователя?</h2>
        <p id="dialog-text"></p>
        <div class="dialog-actions">
          <button class="btn btn-secondary" value="cancel" autofocus>Отмена</button>
          <button class="btn btn-danger" value="confirm">Удалить</button>
        </div>
      </form>
    </dialog>

    <template id="trash-icon"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5.5h13M8 5.5V3.8c0-.4.3-.8.8-.8h2.4c.5 0 .8.4.8.8v1.7M5 5.5l.8 10.2c0 .7.6 1.3 1.3 1.3h5.8c.7 0 1.2-.6 1.3-1.3L15 5.5M8.3 9v5M11.7 9v5"/></svg></template>
    <template id="close-icon"><svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></template>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  </body>
</html>
