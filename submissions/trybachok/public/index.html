<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Пользователи</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/assets/client/app.js"></script>
  </head>
  <body>
    <main>
      <h1>Пользователи</h1>
      <p id="action-status" class="status" role="status"></p>
      <div class="layout">
        <section class="panel" aria-labelledby="create-heading">
          <h2 id="create-heading">Добавить пользователя</h2>
          <form id="user-form" method="post" aria-labelledby="create-heading">
            <fieldset id="user-fields" disabled>
              <div class="field">
                <label for="name">Имя</label>
                <input id="name" name="name" autocomplete="name" required>
              </div>
              <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
              </div>
              <button id="create" class="primary" type="submit">Добавить</button>
            </fieldset>
            <p id="form-error" class="error" role="alert"></p>
          </form>
        </section>
        <section class="panel" aria-labelledby="users-heading">
          <h2 id="users-heading">Список пользователей</h2>
          <div class="field">
            <label for="search">Поиск по имени</label>
            <input id="search" type="search">
          </div>
          <p id="list-status" class="status" role="status"></p>
          <p id="list-error" class="error" role="alert"></p>
          <button id="retry" type="button" hidden>Повторить загрузку</button>
          <p id="delete-error" class="error" role="alert"></p>
          <ul id="users" class="users" role="list"></ul>
        </section>
      </div>
    </main>
  </body>
</html>
