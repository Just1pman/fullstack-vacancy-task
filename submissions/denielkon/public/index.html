<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Пользователи</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/js/main.js"></script>
  </head>
  <body>
    <main>
      <h1>Пользователи</h1>
      <p id="error" class="error" hidden></p>

      <div class="layout">
        <section class="panel users-panel">
          <div class="users-toolbar">
            <div id="search-field" class="search-field">
              <input id="search" type="search" placeholder="Поиск по имени" autocomplete="off">
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="11" cy="11" r="7"/>
                <path d="m20 20-3.8-3.8"/>
              </svg>
              <span class="search-spinner"></span>
            </div>
          </div>
          <div class="users-scroll">
            <p id="list-status" class="list-status"></p>
            <ul id="user-list" class="user-list"></ul>
          </div>
        </section>

        <form id="user-form" class="panel form-panel">
          <h2>Добавить пользователя</h2>
          <div class="field">
            <label for="user-name">Имя</label>
            <input id="user-name" name="name" required maxlength="100" placeholder="Например, Иван Петров" autocomplete="off">
            <p id="name-error" class="field-error"></p>
          </div>
          <div class="field">
            <label for="user-email">Email</label>
            <input id="user-email" name="email" type="email" required maxlength="254" placeholder="name@example.com" autocomplete="off">
            <p id="email-error" class="field-error"></p>
          </div>
          <button id="submit-user" type="submit" class="primary">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            Добавить
          </button>
        </form>
      </div>

      <template id="user-item">
        <li>
          <strong></strong>
          <span class="user-email"></span>
          <button type="button" class="icon-button" title="Удалить">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 7h16M9 7V4.5h6V7"/>
              <path d="M6 7l.9 12.1A2 2 0 0 0 8.9 21h6.2a2 2 0 0 0 2-1.9L18 7"/>
              <path d="M10 11v6M14 11v6"/>
            </svg>
          </button>
        </li>
      </template>
    </main>
  </body>
</html>
