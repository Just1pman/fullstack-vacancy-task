<!doctype html>
<html lang="ru">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Пользователи</title>
      <link rel="stylesheet" href="./styles.css" />
      <script type="module" src="./app.js"></script>
   </head>
   <body>
      <main class="main">
         <h1>Пользователи</h1>

         <section class="main__wrapper">
            <h2>Добавить пользователя</h2>
            <form id="user-form" class="main__form" method="post">
               <label for="user-name">
                  Имя
                  <input id="user-name" name="name" autocomplete="name" required />
               </label>
               <label for="user-email">
                  Email
                  <input id="user-email" name="email" type="email" autocomplete="email" required />
               </label>
               <button id="add-user" class="main__button main__button-add" type="submit">Добавить</button>
            </form>
            <p id="form-status"></p>
         </section>

         <section class="main__wrapper">
            <label for="search">
               Поиск по имени
               <input id="search" type="search" placeholder="Введите имя" />
            </label>
            <p id="delete-status"></p>
            <p id="list-status"></p>
            <ul id="user-list" class="main__user-list"></ul>
         </section>
      </main>
   </body>
</html>
