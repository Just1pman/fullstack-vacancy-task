<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIPFLAT — Управление пользователями</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="header">
    <div class="logo">VIPFLAT</div>
    <div class="subtitle">Управление пользователями</div>
  </header>

  <main class="container">
    <!-- Форма создания -->
    <section class="panel">
      <h2>Добавить пользователя</h2>
      <form id="create-form" class="form">
        <div class="form-row">
          <label for="name">Имя</label>
          <input type="text" id="name" name="name" placeholder="Например, Иван Иванов" required>
        </div>
        <div class="form-row">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="ivan@example.com" required>
        </div>
        <button type="submit" class="btn btn-primary" id="submit-btn">Добавить</button>
      </form>
      <p id="form-error" class="error-text hidden"></p>
    </section>

    <!-- Список -->
    <section class="panel">
      <div class="panel-header">
        <h2>Пользователи</h2>
        <div class="search-box">
          <input type="text" id="search" placeholder="Поиск по имени...">
        </div>
      </div>

      <div id="status" class="status hidden"></div>
      <div id="error" class="error-box hidden"></div>

      <table class="users-table" id="users-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Имя</th>
            <th>Email</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="users-body">
          <!-- строки рендерит JS -->
        </tbody>
      </table>
    </section>
  </main>

  <script src="./dist/app.js"></script>
</body>
</html>
